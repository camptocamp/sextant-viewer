sonar.projectKey=camptocamp_sextant-viewer_6edecd43-7edc-40d2-9488-9287a9b2dd10
sonar.projectName=Sextant Viewer
sonar.sources=src

# The root tsconfig.json is a solution file (empty `files`, only `references`), and the scanner
# does not follow project references: falling back to its own defaults it types the sources with
# strictNullChecks off, and reports the non-null assertions the strict build requires as
# unnecessary. tsconfig.app.json covers every analysed file, specs included.
sonar.typescript.tsconfigPaths=tsconfig.app.json

# No coverage report is produced for this project. Without this the scanner counts every
# executable line as uncovered and the gate scores new code at 0%; excluding the sources from
# coverage leaves the metric unset instead, so the gate's coverage condition is skipped.
sonar.coverage.exclusions=**/*
