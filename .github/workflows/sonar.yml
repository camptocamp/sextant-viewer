name: SonarQube

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, ready_for_review]

jobs:
  sonarqube:
    name: Scan & Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # required for accurate new-code analysis
      
      - name: Install Node & NPM
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      # The strict options tsconfig.app.json inherits from `@vue/tsconfig` live in node_modules.
      # Without them the scanner types the sources loosely and reports the non-null assertions the
      # build requires as unnecessary.
      - name: Install dependencies
        run: npm ci

      - name: Read project version
        id: pkg
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@713881670b6b3676cda39549040e2d88c70d582e # v8.2.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_SEXTANT_VIEWER }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        with:
          projectBaseDir: .
          args: -Dsonar.projectVersion=${{ steps.pkg.outputs.version }}

      - name: SonarQube quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@cf038b0e0cdecfa9e56c198bbb7d21d751d62c3b # v1.2.0
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_SEXTANT_VIEWER }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        with:
          scanMetadataReportFile: .scannerwork/report-task.txt
