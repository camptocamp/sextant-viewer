image: node:lts-trixie

stages:
  - build
  - pages

build:
  stage: build
  script:
    - npm install
    - npm run format:check
    - npm run lint
    - npm run type-check
    - npm run build:lib -- --outDir public --base /viewer/
    - npm run build:app -- --outDir public/app
    # Move the demo index.html to the root of the public Pages directory
    - mv public/demo/index.html public/index.html
    - rmdir public/demo

  artifacts:
    paths:
      - public
    expire_in: 1 week

pages:
  stage: pages
  script:
    - echo "Publishing GitLab Pages"
  artifacts:
    paths:
      - public
  only:
    - main
